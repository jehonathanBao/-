services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-development}
    container_name: toxic-bot
    restart: unless-stopped
    mem_limit: ${BACKEND_MEMORY_LIMIT:-3g}
    mem_reservation: ${BACKEND_MEMORY_RESERVATION:-512m}
    memswap_limit: ${BACKEND_MEMORY_SWAP_LIMIT:-4g}
    pids_limit: ${BACKEND_PIDS_LIMIT:-256}
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      READ_ONLY: "true"
      DRY_RUN: ${DRY_RUN:-true}
      SYSTEM_MODE: ${SYSTEM_MODE:-bear_market}
      ENABLE_ALTCOIN_MONITORING: ${ENABLE_ALTCOIN_MONITORING:-false}
      ENABLE_MEMECOIN_TRACKING: ${ENABLE_MEMECOIN_TRACKING:-false}
      ENABLE_LOW_CAP_SCANNER: ${ENABLE_LOW_CAP_SCANNER:-false}
      API_HOST: 0.0.0.0
      API_PORT: 3000
      WS_SIGNAL_INTERVAL_MS: ${WS_SIGNAL_INTERVAL_MS:-1000}
      SCAN_LOG_BUFFER_SIZE: ${SCAN_LOG_BUFFER_SIZE:-200}
      TOF_ENABLED: ${TOF_ENABLED:-true}
      TOF_VPIN_BUCKET_VOLUME: ${TOF_VPIN_BUCKET_VOLUME:-100000}
      TOF_VPIN_BUCKET_COUNT: ${TOF_VPIN_BUCKET_COUNT:-20}
      TOF_VPIN_HIGH_THRESHOLD: ${TOF_VPIN_HIGH_THRESHOLD:-70}
      TOF_DEPTH_LEVELS: ${TOF_DEPTH_LEVELS:-10}
      TOF_DEPTH_WITHDRAWAL_THRESHOLD: ${TOF_DEPTH_WITHDRAWAL_THRESHOLD:-35}
      TOF_SPREAD_WIDENING_BPS: ${TOF_SPREAD_WIDENING_BPS:-8}
      TOF_ORDER_CHURN_THRESHOLD: ${TOF_ORDER_CHURN_THRESHOLD:-70}
      TOF_SCORE_WEIGHT_EXISTING: ${TOF_SCORE_WEIGHT_EXISTING:-0.60}
      TOF_SCORE_WEIGHT_METRICS: ${TOF_SCORE_WEIGHT_METRICS:-0.40}
      TOF_SCAN_LOG_INTERVAL_SECONDS: ${TOF_SCAN_LOG_INTERVAL_SECONDS:-5}
      PERP_TOF_ENABLED: ${PERP_TOF_ENABLED:-true}
      PERP_OI_BUCKET_SIZE: ${PERP_OI_BUCKET_SIZE:-100000}
      PERP_FUNDING_THRESHOLD: ${PERP_FUNDING_THRESHOLD:-0.05}
      PERP_LIQUIDATION_WINDOW: ${PERP_LIQUIDATION_WINDOW:-5m}
      PERP_AGF_VOLUME_THRESHOLD: ${PERP_AGF_VOLUME_THRESHOLD:-1000000}
      ADVANCED_TOF_ENABLED: ${ADVANCED_TOF_ENABLED:-true}
      ALLOW_LAN_DASHBOARD: "true"
      ALLOWED_DASHBOARD_ORIGIN: ${ALLOWED_DASHBOARD_ORIGIN:-http://localhost:5173}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:?set OPERATOR_TOKEN in your shell or .env before starting compose}
      SQLITE_ENABLED: "true"
      # Storage guardrails: cache retention keeps the DB bounded while these
      # thresholds use real disk pressure as the write-protection signal.
      STORAGE_HEALTH_GUARD_ENABLED: ${STORAGE_HEALTH_GUARD_ENABLED:-true}
      STORAGE_HEALTH_DB_WARN_GB: ${STORAGE_HEALTH_DB_WARN_GB:-115}
      STORAGE_HEALTH_DB_CRITICAL_GB: ${STORAGE_HEALTH_DB_CRITICAL_GB:-130}
      STORAGE_HEALTH_DISK_WARN_PERCENT: ${STORAGE_HEALTH_DISK_WARN_PERCENT:-82}
      STORAGE_HEALTH_DISK_CRITICAL_PERCENT: ${STORAGE_HEALTH_DISK_CRITICAL_PERCENT:-90}
      STORAGE_HEALTH_WAL_WARN_GB: ${STORAGE_HEALTH_WAL_WARN_GB:-1}
      STORAGE_HEALTH_WAL_CRITICAL_GB: ${STORAGE_HEALTH_WAL_CRITICAL_GB:-3}
      SQLITE_PATH: /app/data/btc-toxic-flow.sqlite
      REPLAY_REPORT_DIR: /app/data/reports
      # Binance is the primary source for the orderflow K-line. Keep it on so
      # live monitor buckets can be merged into the public futures K-lines.
      ENABLE_BINANCE: ${ENABLE_BINANCE:-true}
      ENABLE_BYBIT: ${ENABLE_BYBIT:-false}
      ENABLE_OKX: ${ENABLE_OKX:-false}
      # Binance is the sole live CWM source. Other venues remain available in
      # code for legacy replay/audit, but are disabled in production.
      ENABLE_BITFINEX: ${ENABLE_BITFINEX:-false}
      CONTRACT_WHALE_BITFINEX_ENABLED: ${CONTRACT_WHALE_BITFINEX_ENABLED:-false}
      CONTRACT_WHALE_COINBASE_ENABLED: ${CONTRACT_WHALE_COINBASE_ENABLED:-false}
      CONTRACT_WHALE_ENABLED: ${CONTRACT_WHALE_ENABLED:-true}
      CONTRACT_WHALE_DRY_RUN: ${CONTRACT_WHALE_DRY_RUN:-true}
      V4_1_SHADOW_MODE: ${V4_1_SHADOW_MODE:-true}
      V4_1_DIRECTIONAL_ALERTS_ENABLED: ${V4_1_DIRECTIONAL_ALERTS_ENABLED:-false}
      V4_2_ENABLED: ${V4_2_ENABLED:-true}
      V4_2_SHADOW_MODE: ${V4_2_SHADOW_MODE:-false}
      V4_2_DASHBOARD_EARLY_WARNING_ENABLED: ${V4_2_DASHBOARD_EARLY_WARNING_ENABLED:-true}
      V4_2_EXTERNAL_DIRECTIONAL_ALERTS_ENABLED: ${V4_2_EXTERNAL_DIRECTIONAL_ALERTS_ENABLED:-true}
      V4_2_AUTO_GATE_ENABLED: ${V4_2_AUTO_GATE_ENABLED:-true}
      V4_2_AUTO_GATE_ARMED: ${V4_2_AUTO_GATE_ARMED:-true}
      V4_2_AUTO_GATE_FORCE_CLOSED: ${V4_2_AUTO_GATE_FORCE_CLOSED:-false}
      V4_2_AUTO_GATE_CANARY_ENABLED: ${V4_2_AUTO_GATE_CANARY_ENABLED:-true}
      HOURLY_DELTA_ALERT_ENABLED: ${HOURLY_DELTA_ALERT_ENABLED:-false}
      HOURLY_DELTA_ALERT_DRY_RUN: ${HOURLY_DELTA_ALERT_DRY_RUN:-false}
      HOURLY_DELTA_ALERT_THRESHOLD_BTC: ${HOURLY_DELTA_ALERT_THRESHOLD_BTC:-1000}
      HOURLY_DELTA_ALERT_DISCORD_ENABLED: ${HOURLY_DELTA_ALERT_DISCORD_ENABLED:-true}
      HOURLY_DELTA_ALERT_RECONCILE_INTERVAL_MS: ${HOURLY_DELTA_ALERT_RECONCILE_INTERVAL_MS:-15000}
      HOURLY_DELTA_ALERT_RECONCILE_LOOKBACK_HOURS: ${HOURLY_DELTA_ALERT_RECONCILE_LOOKBACK_HOURS:-6}
      HOURLY_DELTA_DISCORD_WEBHOOK_URL: ${HOURLY_DELTA_DISCORD_WEBHOOK_URL:-}
      SPOT_WHALE_ENABLED: ${SPOT_WHALE_ENABLED:-false}
      SPOT_WHALE_DRY_RUN: ${SPOT_WHALE_DRY_RUN:-true}
      SPOT_WHALE_BINANCE_ENABLED: ${SPOT_WHALE_BINANCE_ENABLED:-true}
      SPOT_WHALE_COINBASE_ENABLED: ${SPOT_WHALE_COINBASE_ENABLED:-true}
      SPOT_WHALE_BITFINEX_ENABLED: ${SPOT_WHALE_BITFINEX_ENABLED:-true}
      SPOT_WHALE_DISCORD_ENABLED: ${SPOT_WHALE_DISCORD_ENABLED:-true}
      SPOT_WHALE_DISCORD_BTC_ONLY: ${SPOT_WHALE_DISCORD_BTC_ONLY:-false}
      SPOT_WHALE_DISCORD_BTC_MIN_ABS_NET_DIRECTION_BASE: ${SPOT_WHALE_DISCORD_BTC_MIN_ABS_NET_DIRECTION_BASE:-200}
      SPOT_WHALE_DISCORD_WEBHOOK_URL: ${SPOT_WHALE_DISCORD_WEBHOOK_URL:-}
      BINANCE_ALT_CONTRACT_ENABLED: ${BINANCE_ALT_CONTRACT_ENABLED:-false}
      BINANCE_ALT_CONTRACT_DRY_RUN: ${BINANCE_ALT_CONTRACT_DRY_RUN:-true}
      BINANCE_ALT_CONTRACT_BINANCE_ENABLED: ${BINANCE_ALT_CONTRACT_BINANCE_ENABLED:-true}
      BINANCE_ALT_CONTRACT_UNIVERSE_MODE: ${BINANCE_ALT_CONTRACT_UNIVERSE_MODE:-all_binance_usdt_perp}
      BINANCE_ALT_CONTRACT_WHITELIST: ${BINANCE_ALT_CONTRACT_WHITELIST:-}
      BINANCE_ALT_CONTRACT_BLACKLIST: ${BINANCE_ALT_CONTRACT_BLACKLIST:-}
      BINANCE_ALT_CONTRACT_EXCLUDE_SYMBOLS: ${BINANCE_ALT_CONTRACT_EXCLUDE_SYMBOLS:-BTCUSDT,ETHUSDT}
      BINANCE_ALT_CONTRACT_HOT_1S_RETENTION_HOURS: ${BINANCE_ALT_CONTRACT_HOT_1S_RETENTION_HOURS:-24}
      BINANCE_ALT_CONTRACT_FLOW_1M_RETENTION_DAYS: ${BINANCE_ALT_CONTRACT_FLOW_1M_RETENTION_DAYS:-7}
      BINANCE_ALT_CONTRACT_SIGNALS_RETENTION_DAYS: ${BINANCE_ALT_CONTRACT_SIGNALS_RETENTION_DAYS:-7}
      BINANCE_ALT_CONTRACT_CLEANUP_INTERVAL_SEC: ${BINANCE_ALT_CONTRACT_CLEANUP_INTERVAL_SEC:-3600}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      SHORT_TOXIC_DISCORD_WEBHOOK_URL: ${SHORT_TOXIC_DISCORD_WEBHOOK_URL:-}
      SHORT_TOXIC_DISCORD_AUTO_PUSH_ENABLED: ${SHORT_TOXIC_DISCORD_AUTO_PUSH_ENABLED:-true}
      CONTRACT_WHALE_DISCORD_WEBHOOK_URL: ${CONTRACT_WHALE_DISCORD_WEBHOOK_URL:-}
      CONTRACT_WHALE_DISCORD_AUTO_PUSH_ENABLED: ${CONTRACT_WHALE_DISCORD_AUTO_PUSH_ENABLED:-true}
      TOF_ANOMALY_DISCORD_WEBHOOK_URL: ${TOF_ANOMALY_DISCORD_WEBHOOK_URL:-}
      TOF_ANOMALY_DISCORD_AUTO_PUSH_ENABLED: ${TOF_ANOMALY_DISCORD_AUTO_PUSH_ENABLED:-true}
      ALERT_MIN_SCORE: ${ALERT_MIN_SCORE:-80}
      ALERT_MIN_DATA_QUALITY: ${ALERT_MIN_DATA_QUALITY:-70}
      DISCORD_AUTO_PUSH_ENABLED: ${DISCORD_AUTO_PUSH_ENABLED:-true}
      DISCORD_AUTO_PUSH_CACHED_ON_BOOT: ${DISCORD_AUTO_PUSH_CACHED_ON_BOOT:-false}
      DISCORD_AUTO_PUSH_INTERVAL_MS: ${DISCORD_AUTO_PUSH_INTERVAL_MS:-1000}
      # Independent VPIN/TOF anomaly alerts (separate from detector candidates).
      TOF_DISCORD_ALERT_ENABLED: ${TOF_DISCORD_ALERT_ENABLED:-true}
      TOF_DISCORD_VPIN_THRESHOLD: ${TOF_DISCORD_VPIN_THRESHOLD:-70}
      TOF_DISCORD_RELATIVE_VPIN_THRESHOLD: ${TOF_DISCORD_RELATIVE_VPIN_THRESHOLD:-70}
      TOF_DISCORD_TOF_THRESHOLD: ${TOF_DISCORD_TOF_THRESHOLD:-75}
      TOF_DISCORD_MIN_BUCKETS: ${TOF_DISCORD_MIN_BUCKETS:-10}
      TOF_DISCORD_ALERT_MIN_SCORE: ${TOF_DISCORD_ALERT_MIN_SCORE:-70}
      TOF_DISCORD_ALERT_MIN_CONFIDENCE: ${TOF_DISCORD_ALERT_MIN_CONFIDENCE:-60}
      TOF_DISCORD_ALERT_MIN_DATA_QUALITY: ${TOF_DISCORD_ALERT_MIN_DATA_QUALITY:-60}
      TOF_DISCORD_COOLDOWN_SECONDS: ${TOF_DISCORD_COOLDOWN_SECONDS:-300}
      DISCORD_PUSH_COOLDOWN_SECONDS: ${DISCORD_PUSH_COOLDOWN_SECONDS:-60}
    ports:
      - "127.0.0.1:8000:3000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD-SHELL", "test -x /app/btc-toxic-flow-monitor-rs"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./toxic-order-monitor
      dockerfile: Dockerfile.frontend
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-development}
    container_name: toxic-frontend
    restart: unless-stopped
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-256m}
    mem_reservation: ${FRONTEND_MEMORY_RESERVATION:-32m}
    memswap_limit: ${FRONTEND_MEMORY_SWAP_LIMIT:-384m}
    pids_limit: ${FRONTEND_PIDS_LIMIT:-64}
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      - backend
    environment:
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:?set OPERATOR_TOKEN in your shell or .env before starting compose}
      INTERNAL_API_ORIGIN: ${INTERNAL_API_ORIGIN:-http://127.0.0.1:3000}
    ports:
      - "${DASHBOARD_BIND_HOST:-127.0.0.1}:${DASHBOARD_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
