server {
    listen 80;
    listen 5173;
    server_name _;

    access_log /var/log/nginx/toxic-order-monitor.access.log;
    error_log /var/log/nginx/toxic-order-monitor.error.log warn;

    location ^~ /api/system/ {
        return 404;
    }

    location = /api/contract-whale/pipeline-debug {
        return 404;
    }

    location = /api/contract-whale/raw-flow-debug {
        return 404;
    }

    location = /api/contract-whale/latency-debug {
        return 404;
    }

    location = /api/binance-alt-contract/runtime-debug {
        return 404;
    }

    location /api/ {
        if ($request_method = POST) {
            return 403;
        }
        include /etc/nginx/snippets/toxic-order-monitor-token.conf;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /ws/ {
        include /etc/nginx/snippets/toxic-order-monitor-token.conf;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:5174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
    }
}
