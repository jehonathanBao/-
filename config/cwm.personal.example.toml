# Personal CWM dry-run overlay.
#
# Copy this file to `config/cwm.personal.local.toml`, keep the local file
# uncommitted, then start the backend with:
#
#   $env:APP_CONFIG_FILE = "config/cwm.personal.local"
#   cargo run -- serve
#
# This overlay keeps the system read-only and Discord in dry-run mode.

enable_bitfinex = true

[system]
mode = "bear_market"

[features]
altcoin_monitoring = false
memecoin_tracking = false
low_cap_scanner = false

[toxicOrder]
max_price_deviation_pct = 5.0
enable_spot_score = true
enable_contract_score = true

[contract_whale_monitor]
enabled = true
dry_run = true

[contract_whale_monitor.retention]
flow_1s_days = 7
signals_days = 7
impact_b_days = 30
critical_days = 365

[contract_whale_monitor.hourly_delta_alert]
enabled = true
exchange = "binance"
symbol = "BTCUSDT"
interval = "1h"
threshold_btc = 1000.0
close_grace_seconds = 5
startup_backfill_hours = 2
rest_reconcile_interval_ms = 15000
rest_reconcile_lookback_hours = 6
discord_enabled = true
dry_run = true

[contract_whale_monitor.exchanges.binance]
enabled = true

[contract_whale_monitor.exchanges.binance.perp]
enabled = true
role = "primary"

[contract_whale_monitor.exchanges.binance.spot]
enabled = true
role = "primary"

[contract_whale_monitor.exchanges.bitfinex]
enabled = true

[contract_whale_monitor.exchanges.bitfinex.perp]
enabled = true
role = "confirmation"

[contract_whale_monitor.exchanges.bitfinex.spot]
enabled = true
role = "confirmation"

[contract_whale_monitor.exchanges.coinbase]
enabled = true

[contract_whale_monitor.exchanges.coinbase.spot]
enabled = true
role = "spot_confirmation"

[contract_whale_monitor.exchanges.coinbase.perp]
enabled = false
product = "BTC-PERP"
source = "coinbase_intx_match"
role = "confirmation"
requires_auth = true
market_data_only = true

[contract_whale_monitor.exchanges.okx]
enabled = false

[contract_whale_monitor.exchanges.okx.spot]
enabled = false
role = "disabled"

[contract_whale_monitor.exchanges.okx.perp]
enabled = false
role = "disabled"

[spot_whale_monitor]
enabled = true
dry_run = true

[spot_whale_monitor.retention]
signals_days = 7
important_days = 30
critical_days = 365

[spot_whale_monitor.exchanges.binance]
enabled = true

[spot_whale_monitor.exchanges.coinbase]
enabled = true

[spot_whale_monitor.exchanges.bitfinex]
enabled = true

[spot_whale_monitor.performance]
scan_interval_ms = 2000
duplicate_window_ms = 60000

[binance_alt_contract_monitor]
enabled = true
dry_run = true
universe_mode = "all_binance_usdt_perp"
symbol_limit = 0
exclude_symbols = ["BTCUSDT", "ETHUSDT"]
whitelist = []
blacklist = []

[binance_alt_contract_monitor.symbol_filter]
quote_asset = "USDT"
contract_type = "PERPETUAL"
status = "TRADING"
min_24h_quote_volume_usd = 0

[binance_alt_contract_monitor.exchanges.binance]
enabled = true

[binance_alt_contract_monitor.detector]
scan_interval_ms = 2000
candidate_ttl_sec = 600
max_full_scores_per_sec = 8
max_global_full_scoring_per_sec = 8
max_burst_full_scoring = 3
burst_window_ms = 1000

[binance_alt_contract_monitor.flow_state]
per_symbol_enabled = true
bucket_retention_seconds = 3900

[binance_alt_contract_monitor.scheduler]
enabled = true
full_scores_per_second = 60
max_scores_per_symbol_per_second = 3
candidate_max_age_seconds = 10
tier_a_b_share = 0.40
tier_c_share = 0.30
tier_d_e_share = 0.30
liquidation_priority_bonus = 20
ageing_points_per_second = 2

[binance_alt_contract_monitor.universe]
refresh_seconds = 300
dynamic_reconcile_enabled = true

[binance_alt_contract_monitor.oi_scheduler]
enabled = true
all_symbols_interval_sec = 600
hot_symbols_interval_sec = 30
candidate_ttl_sec = 600
max_oi_requests_per_sec = 2
immediate_fetch_on_candidate = true

[binance_alt_contract_monitor.self_learning]
mode = "disabled"
min_samples = 100

[binance_alt_contract_monitor.liquidation]
retention_seconds = 600
deduplicate = true

[binance_alt_contract_monitor.impact]
require_reliable_reference = true
ticker_max_age_seconds = 120
absolute_floor_required = true

[binance_alt_contract_monitor.outcomes]
enabled = true
min_samples_for_reporting = 100

[binance_alt_contract_monitor.lifecycle]
tier_a_b_merge_seconds = 180
tier_c_merge_seconds = 120
tier_d_e_merge_seconds = 60
liquidation_merge_seconds = 90

[binance_alt_contract_monitor.storage]
persist_all_1s = false
persist_all_1m = true
persist_hot_1s = true
hot_1s_retention_hours = 24
flow_1m_retention_days = 7
signals_retention_days = 7
cleanup_interval_sec = 3600
queue_capacity = 10000
batch_size = 100
flush_interval_ms = 500
jsonl_archive_enabled = false

[binance_alt_contract_monitor.display]
min_notional_usd = 150000
ultra_core_min_notional_usd = 750000
mainstream_min_notional_usd = 500000
alt_min_notional_usd = 150000

[binance_alt_contract_monitor.market_classification]
ultra_core_symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "BNBUSDT"]
top50_symbols = [
  "XRPUSDT", "DOGEUSDT", "ADAUSDT", "TRXUSDT", "AVAXUSDT", "LINKUSDT",
  "SUIUSDT", "TONUSDT", "LTCUSDT", "BCHUSDT", "DOTUSDT", "UNIUSDT",
  "NEARUSDT", "AAVEUSDT", "APTUSDT", "ICPUSDT", "ETCUSDT", "FILUSDT",
  "ARBUSDT", "OPUSDT", "POLUSDT", "MATICUSDT", "ATOMUSDT", "INJUSDT",
  "STXUSDT", "RENDERUSDT", "TAOUSDT", "IMXUSDT", "HBARUSDT", "VETUSDT",
  "ALGOUSDT", "XLMUSDT", "SEIUSDT", "ARUSDT", "FETUSDT", "WLDUSDT",
  "JUPUSDT", "TIAUSDT", "GRTUSDT", "MKRUSDT", "ENAUSDT", "RUNEUSDT",
  "QNTUSDT", "SANDUSDT", "MANAUSDT", "LDOUSDT"
]

[binance_alt_contract_monitor.discord]
enabled = true
dry_run = true
webhook_env = "BACM_DISCORD_WEBHOOK_URL"
cooldown_sec = 900
global_hourly_cap = 12
min_data_quality = 70
min_display_notional_usd = 500000
push_build_score = 80
push_abnormal_score = 90
push_main_force_confidence = 75
push_min_evidence_count = 4
allow_liquidation_alerts = true
push_liquidation_abnormal_score = 92
min_abnormal_score = 85
min_build_score = 80
market_wide_symbol_count = 15
market_wide_ratio = 0.12
market_wide_top_n = 5

[binance_alt_contract_monitor.discord.tier_a]
enabled = true
min_notional_usd = 3000000
critical_notional_usd = 8000000
s_notional_usd = 20000000
s_enabled = true
require_build_score = 80
require_abnormal_score = 90
require_non_liquidation = false

[binance_alt_contract_monitor.discord.tier_b]
enabled = true
min_notional_usd = 1500000
critical_notional_usd = 3000000
s_notional_usd = 8000000
s_enabled = true
require_build_score = 80
require_abnormal_score = 90
require_non_liquidation = false

[binance_alt_contract_monitor.discord.tier_c]
enabled = true
min_notional_usd = 500000
critical_notional_usd = 1500000
s_notional_usd = 4000000
s_enabled = true
require_build_score = 80
require_abnormal_score = 90
require_non_liquidation = false

[binance_alt_contract_monitor.discord.tier_d]
enabled = true
min_notional_usd = 500000
critical_notional_usd = 1200000
s_notional_usd = 999999999999
s_enabled = false
require_build_score = 85
require_abnormal_score = 85
require_non_liquidation = true

[binance_alt_contract_monitor.discord.tier_e]
enabled = false
min_notional_usd = 999999999999
critical_notional_usd = 999999999999
s_notional_usd = 999999999999
s_enabled = false
require_build_score = 90
require_abnormal_score = 92
require_non_liquidation = true

[binance_alt_contract_monitor.tier_rules.tier_d]
discord_min_abnormal_score = 85
discord_min_build_score = 85
require_non_liquidation = true
max_severity_without_build_confirmation = "high"

[binance_alt_contract_monitor.tier_rules.tier_e]
discord_min_abnormal_score = 92
discord_min_build_score = 90
min_dynamic_multiple = 10.0
require_oi_confirmation = true
require_non_liquidation = true
max_severity_without_build_confirmation = "high"
