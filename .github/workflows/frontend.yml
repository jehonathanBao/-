name: Frontend CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: toxic-order-monitor/package-lock.json

      - name: Install dependencies
        working-directory: toxic-order-monitor
        run: npm ci

      - name: Dependency audit
        working-directory: toxic-order-monitor
        run: npm audit --audit-level=high

      - name: Build
        working-directory: toxic-order-monitor
        run: npm run build

      - name: Test
        working-directory: toxic-order-monitor
        run: npm run test
